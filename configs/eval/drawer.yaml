defaults:
  - launcher: local
  - solver: cem
  - _self_
world:
  env_name: swm/DexMimicGen-v0
  task: TwoArmDrawerCleanup
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  # Must equal the resolution the training pixels were rendered at. drawer_cleanup's are native 224,
  # and DexMimicGenEnv defaults to 84, so leaving this out renders 84 and lets the resize wrapper
  # upscale it to 224 -- the policy then sees a blurred frame at eval and a sharp one in training.
  # The recorded drawer numbers (head 18-26%) were measured without this line.
  resolution: 224
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state
seed: 42
policy: random
plan_config:
  horizon: 10
  receding_horizon: 10
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 50
  eval_budget: 100
  img_size: 224
  dataset_name: drawer_cleanup
  callables:
    - method: set_state
      args:
        state: {value: state}
        ep_idx: {value: ep_idx}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
output:
  filename: drawer_results.txt
