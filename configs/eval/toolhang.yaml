# Task completion: eval.full_traj=true eval.task_only=true
defaults:
  - base
  - _self_

world:
  env_name: swm/RoboMimicGC-v0
  task: ToolHang
  resolution: 224
  goal_threshold: 0.04
  eef_threshold: 0.04
  env_meta: assets/robomimic_toolhang_env_meta.json

dataset:
  keys_to_cache: [action, proprio, state]

eval:
  goal_offset_steps: 50
  eval_budget: 100
  dataset_name: toolhang
  callables:
    - method: set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
