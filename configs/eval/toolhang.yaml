defaults:
  - launcher: local
  - solver: cem
  - _self_
world:
  env_name: swm/RoboMimicGC-v0
  task: ToolHang
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  # tool_hang pixels are native 224 (downscaled from the release's 384). Explicit so
  # the frame the policy sees never depends on the env class's default.
  resolution: 224
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state
seed: 42
policy: random
plan_config:
  horizon: 10
  receding_horizon: 10
  action_block: 5  # == robomimic_tool_hang frameskip: the head emits 5 stacked actions
eval:
  num_eval: 50
  goal_offset_steps: 50
  eval_budget: 100
  img_size: 224
  dataset_name: tool_hang_eval
  callables:
    - method: set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
output:
  filename: toolhang_results.txt
