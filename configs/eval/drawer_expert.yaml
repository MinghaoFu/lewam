# drawer.yaml + the start-step callable the expert-replay positive control needs (DEXMG_EXPERT_OVERRIDE=1 in the
# env; the wrapper then replays the demo's recorded action for row start_step + t). step_idx is the constant 0
# because this config is meant for the start-to-finish protocol (+gip_eval.full_traj=true), where every episode
# starts at row 0 of its demo. Not a scoring config: it measures what the recorded demos achieve through the
# exact eval path (reset_to from model_xml + the env's own success predicate).
defaults:
  - launcher: local
  - solver: cem
  - _self_
world:
  env_name: swm/DexMimicGen-v0
  task: TwoArmDrawerCleanup
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  resolution: 224
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state
seed: 42
policy: random
plan_config:
  horizon: 10
  receding_horizon: 10
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 50
  eval_budget: 100
  img_size: 224
  dataset_name: drawer_cleanup_fixed
  callables:
    - method: set_state
      args:
        state: {value: state}
        ep_idx: {value: ep_idx}
    - method: _set_start_step
      args:
        step_idx: {value: 0, in_dataset: False}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
output:
  filename: drawer_expert_results.txt
