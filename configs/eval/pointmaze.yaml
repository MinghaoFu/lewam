defaults:
  - launcher: local
  - solver: cem
  - _self_
world:
  env_name: swm/PointMaze-v0
  task: medium            # medium | large | giant | teleport
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  # pointmaze has no released pixels. Set this to whatever the dataset ends up rendered at, which
  # for a new cell should just be 224 so no resampling happens anywhere.
  resolution: 224
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state
seed: 42
policy: random
plan_config:
  horizon: 10
  receding_horizon: 10
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 50
  eval_budget: 100
  img_size: 224
  dataset_name: pointmaze_medium_eval
  callables:
    - method: set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
output:
  filename: pointmaze_results.txt
