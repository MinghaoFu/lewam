# Task completion: eval.full_traj=true eval.task_only=true
defaults:
  - base
  - _self_

world:
  env_name: swm/DexMimicGen-v0
  task: TwoArmTransport
  resolution: 224
  goal_threshold: 0.04
  eef_threshold: 0.10
  env_meta: assets/dexmg_transport_env_meta.json
  model_xml_h5: ${oc.env:STABLEWM_HOME}/datasets/${eval.dataset_name}.h5   # its model_xml column

dataset:
  keys_to_cache: [action, proprio, state]

eval:
  goal_offset_steps: 50
  eval_budget: 100
  dataset_name: transport
  callables:
    - method: set_state
      args:
        state: {value: state}
        ep_idx: {value: ep_idx}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
    - method: _set_goal_proprio
      args:
        goal_proprio: {value: goal_proprio}
