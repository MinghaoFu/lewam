# Goal reaching on the policy-collected reacher data, with its target kept visible
defaults:
  - base
  - _self_

world:
  env_name: swm/ReacherVisibleTargetDMControl-v0
  task: qpos_match

eval:
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: reacher_policy
  callables:
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
    - method: set_task_target_pos
      args:
        target_pos: {value: target_pos}
        goal_target_pos: {value: goal_target_pos}
    - method: set_target_qpos
      args:
        target_qpos: {value: goal_qpos}
