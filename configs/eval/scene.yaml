defaults:
  - base
  - _self_

world:
  env_name: swm/OGBScene-v0
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
  eef_threshold: 0.04       # success also needs the end effector within this distance of the goal's

eval:
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: scene_expert
  callables:
    # the button states live outside qpos/qvel, one kwarg per button
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
        button_state_0: {value: privileged_button_0_state}
        button_state_1: {value: privileged_button_1_state}
    # goal = the goal frame's actual scene state, not the collection oracle's *_target_* columns
    # (the data chains subtasks, so those hold the next subtask's goal); success needs all of them
    - method: set_cube_target_pos
      args:
        cube_id: {value: 0, in_dataset: false}
        target_pos: {value: goal_privileged_block_0_pos}
        target_quat: {value: goal_privileged_block_0_quat}
    - method: set_target_button_state
      args:
        button_id: {value: 0, in_dataset: false}
        target_state: {value: goal_privileged_button_0_state}
    - method: set_target_button_state
      args:
        button_id: {value: 1, in_dataset: false}
        target_state: {value: goal_privileged_button_1_state}
    - method: set_target_drawer_pos
      args:
        target_pos: {value: goal_privileged_drawer_pos}
    - method: set_target_window_pos
      args:
        target_pos: {value: goal_privileged_window_pos}
    - method: set_goal_effector
      args:
        goal_effector: {value: goal_proprio_effector_pos}
