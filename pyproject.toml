[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lewam"
version = "0.1.0"
description = "LeWAM: End-to-end World and Action Modeling with JEPAs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "stable-worldmodel[format,train]==0.1.1",
    "stable-pretraining==0.1.7",
    "timm>=1.0.20",
    "pygame",
    "pymunk",
    "shapely",
    "ogbench==1.2.1",
    # mujoco>=3.10 changed mj_fullM(m, dst, M) -> mj_fullM(m, d, dst), which robosuite 1.5.x still calls the
    # old way, so Drawer/Transport/Tool Hang fail at the first env.step. dm_control pins mujoco>=its release,
    # 1.0.41 is the last release before 3.10.
    "mujoco==3.8.1",
    "dm_control==1.0.41",
    "robosuite==1.5.1",
    # runtime imports of robomimic, which is installed with --no-deps (see README)
    "egl_probe>=1.0.1",
    "termcolor",
    "tensorboardX",
    "psutil",
]

[tool.setuptools]
packages = ["lewam", "lewam.models", "lewam.train", "lewam.eval", "lewam.envs"]
