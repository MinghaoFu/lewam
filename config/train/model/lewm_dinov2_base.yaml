_target_: jepa.JEPA
# Infra knob: true = action-history-conditioned intention (default);
# false = state-only intention ("world action model"). Override per-run:
#   model.use_action_history=false
use_action_history: true
# Infra knob: proprio-as-token (DINO-WM style, predicted in embedding space).
# Override per-run: model.use_proprio=true . Default false = pixels-only (current behavior).
use_proprio: false

# Weight-init ablation variant: encoder ARCHITECTURE is held FIXED at facebook/dinov2-base
# (384-dim, patch14, 12 layers, 22.1M params). The ONLY thing the ablation flips is the
# weight init:  model.encoder.pretrained=true  -> load real DINOv2 weights (treatment)
#               model.encoder.pretrained=false -> random init of the SAME arch (control).
# REQUIRED companion override: embed_dim=384  (lewm.yaml default is 192 for vit-tiny).
# jepa.JEPA reads only output.last_hidden_state[:,0] (the CLS token) with
# interpolate_pos_encoding=True, so dinov2 is a drop-in for vit_hf at this interface.
encoder:
  _target_: stable_pretraining.backbone.utils.from_huggingface
  model_name: facebook/dinov2-base
  pretrained: true

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
